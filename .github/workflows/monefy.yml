name: Monefy
on:
  pull_request:
    paths: ["examples/monefy/**", "packages/**", ".github/workflows/monefy.yml"]
  push:
    branches: [master, deploy/monefy-ec2]
    paths: ["examples/monefy/**", "packages/**", ".github/workflows/monefy.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monefy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: examples/monefy/package-lock.json
      - name: Test private host configuration and HTTPS renewal
        run: python3 -m unittest discover -s examples/monefy/infra/aws/tests -v
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend and worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: examples/monefy/backend/Dockerfile
          load: true
          tags: monefy-backend:local
          cache-from: type=gha,scope=monefy-backend
          cache-to: type=gha,scope=monefy-backend,mode=max
      - name: Build nginx frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: examples/monefy/frontend/Dockerfile
          load: true
          tags: monefy-frontend:local
          cache-from: type=gha,scope=monefy-frontend
          cache-to: type=gha,scope=monefy-frontend,mode=max
      - name: Check cache and PDF delay flag
        run: docker run --rm --entrypoint node -v "$PWD/examples/monefy/tests:/app/tests:ro" monefy-backend:local --test /app/tests/pdf-cache.test.cjs
      - name: Install browser tooling from the lockfile
        working-directory: examples/monefy
        run: |
          node scripts/sync-adira.mjs
          npm --prefix . ci --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Test the running stack through nginx
        working-directory: examples/monefy
        env:
          MONEFY_BROWSER_TEST: "true"
        run: |
          cp .env.example .env
          docker compose --profile dev up -d --no-build --wait --wait-timeout 180
          docker compose --profile tools run --rm seed
          npm --prefix . run test:smoke
      - name: Container diagnostics
        if: failure()
        working-directory: examples/monefy
        run: docker compose logs --tail=100
      - name: Stop test services
        if: always()
        working-directory: examples/monefy
        run: docker compose --profile dev --profile tools down --volumes --remove-orphans
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/deploy/monefy-ec2'))
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_STACK_NAME: ${{ vars.AWS_STACK_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24" }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: monefy-${{ github.run_id }}
      - name: Read deployment targets
        id: targets
        run: |
          aws cloudformation describe-stacks --stack-name "$AWS_STACK_NAME" --query 'Stacks[0].Outputs' --output json > /tmp/monefy-targets.json
          python3 - <<'PY'
          import json, os
          values = json.load(open('/tmp/monefy-targets.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for item in values:
                  if '\n' in item['OutputValue'] or '\r' in item['OutputValue']:
                      raise ValueError('Invalid stack output')
                  output.write(item['OutputKey'] + '=' + item['OutputValue'] + '\n')
          PY
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish backend
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: examples/monefy/backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.targets.outputs.BackendRepositoryUri }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=monefy-backend
          cache-to: type=gha,scope=monefy-backend,mode=max
      - name: Publish frontend
        id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: examples/monefy/frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.targets.outputs.FrontendRepositoryUri }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=monefy-frontend
          cache-to: type=gha,scope=monefy-frontend,mode=max
      - name: Deploy and check HTTPS readiness
        env:
          INSTANCE_ID: ${{ steps.targets.outputs.InstanceId }}
          RELEASE_BUCKET: ${{ steps.targets.outputs.ReleaseBucket }}
          PUBLIC_ORIGIN: ${{ steps.targets.outputs.PublicOrigin }}
          TLS_EMAIL: ${{ steps.targets.outputs.TlsEmail }}
          FRONTEND_IMAGE: ${{ steps.targets.outputs.FrontendRepositoryUri }}@${{ steps.frontend.outputs.digest }}
          BACKEND_IMAGE: ${{ steps.targets.outputs.BackendRepositoryUri }}@${{ steps.backend.outputs.digest }}
        run: node examples/monefy/infra/aws/deploy.mjs
