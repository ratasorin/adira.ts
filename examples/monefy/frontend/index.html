<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>monefy</title>
  </head>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      font-family: "Inter", serif;
      --hue: 163;
      --hue2: 160;
      --fg: hsl(0, 0%, 100%);
    }
    #root {
      width: 100%;
    }

    .pl {
      font-size: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      width: 9.1em;
      height: 9.1em;
    }
    .pl__coin,
    .pl__coin-flare,
    .pl__coin-inscription,
    .pl__coin-layers,
    .pl__shadow {
      animation-duration: 2s;
      animation-timing-function: cubic-bezier(0.37, 0, 0.63, 1);
      animation-iteration-count: infinite;
    }
    .pl__coin {
      animation-name: bounce;
      position: relative;
      transform: translateY(0.5em);
      z-index: 1;
    }
    .pl__coin-flare,
    .pl__coin-inscription,
    .pl__coin-layer {
      position: absolute;
    }
    .pl__coin-flare {
      animation-name: flare1;
      background-color: white;
      clip-path: polygon(
        50% 0,
        67% 33%,
        100% 50%,
        67% 67%,
        50% 100%,
        33% 67%,
        0 50%,
        33% 33%
      );
      top: 0;
      left: -0.5em;
      width: 1em;
      height: 1em;
      transform: scale(0);
      z-index: 1;
    }
    .pl__coin-flare:nth-child(2) {
      animation-name: flare2;
      top: -0.5em;
      left: 0;
    }
    .pl__coin-flare:nth-child(3) {
      animation-name: flare3;
      left: 3em;
    }
    .pl__coin-flare:nth-child(4) {
      animation-name: flare4;
      top: -0.5em;
      left: 3.5em;
    }
    .pl__coin-inscription {
      animation-name: inscription-front;
      background-color: hsl(var(--hue2), 90%, 45%);
      box-shadow: 0.1875em 0 0 hsl(var(--hue2), 90%, 40%) inset;
      top: 50%;
      left: 50%;
      width: 0.5em;
      height: 2.5em;
      transform: translate(-50%, -50%) rotateZ(30deg);
    }
    .pl__coin-layer {
      background-color: hsl(var(--hue2), 90%, 50%);
      backface-visibility: hidden;
      border-radius: 50%;
      box-shadow: 0 0 0 0.375em hsl(var(--hue2), 90%, 70%) inset;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .pl__coin-layer:first-child {
      transform: translate3d(0, 0, 0.5em);
    }
    .pl__coin-layer:nth-child(2) {
      transform: translate3d(0, 0, 0.49em) rotateY(180deg);
    }
    .pl__coin-layer:nth-child(3) {
      backface-visibility: visible;
      border-radius: 0;
      left: 50%;
      width: 0.98em;
      transform: translateX(-50%) rotateY(90deg);
    }
    .pl__coin-layer:nth-child(4) {
      transform: translate3d(0, 0, -0.49em);
    }
    .pl__coin-layer:last-child {
      transform: translate3d(0, 0, -0.5em) rotateY(180deg);
    }
    .pl__coin-layer:nth-child(n + 2):nth-last-child(n + 2) {
      background-color: hsl(var(--hue2), 90%, 40%);
      box-shadow: none;
    }
    .pl__coin-layer:last-child .pl__coin-inscription {
      animation-name: inscription-back;
      transform: translate(-50%, -50%) rotateZ(-30deg);
    }
    .pl__coin-layers {
      animation-name: roll;
      position: relative;
      width: 4em;
      height: 4em;
      transform: rotateY(-15deg) rotateZ(-30deg);
      transform-style: preserve-3d;
    }
    .pl__shadow {
      animation-name: shadow;
      background-color: hsla(var(--hue), 90%, 10%, 0.3);
      border-radius: 50%;
      width: 4em;
      height: 0.5em;
    }

    /* Animations */
    @keyframes bounce {
      from,
      50%,
      to {
        animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0);
        transform: translateY(0.5em);
      }
      25%,
      75% {
        animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
        transform: translateY(5.1em);
      }
    }
    @keyframes flare1 {
      from,
      75%,
      to {
        animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0);
        transform: scale(0);
      }
      87.5% {
        animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
        transform: scale(1);
      }
    }
    @keyframes flare2 {
      from,
      to {
        animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
        transform: scale(1);
      }
      12.5%,
      87.5% {
        animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0);
        transform: scale(0);
      }
    }
    @keyframes flare3 {
      from,
      25%,
      50%,
      to {
        animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0);
        transform: scale(0);
      }
      37.5% {
        animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
        transform: scale(1);
      }
    }
    @keyframes flare4 {
      from,
      37.5%,
      62.5%,
      to {
        animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0);
        transform: scale(0);
      }
      50% {
        animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
        transform: scale(1);
      }
    }
    @keyframes inscription-front {
      from,
      75% {
        animation-timing-function: cubic-bezier(0.12, 0, 0.39, 0);
        box-shadow: 0.1875em 0 0 hsl(var(--hue2), 90%, 40%) inset;
      }
      87.49% {
        animation-timing-function: steps(1);
        box-shadow: 0.875em -0.75em 0 hsl(var(--hue2), 90%, 40%) inset;
      }
      87.5% {
        animation-timing-function: cubic-bezier(0.61, 1, 0.88, 1);
        box-shadow: -0.875em 0.75em 0 hsl(var(--hue2), 90%, 40%) inset;
      }
      to {
        box-shadow: 0.1875em 0 hsl(var(--hue2), 90%, 40%) inset;
      }
    }
    @keyframes inscription-back {
      from,
      75% {
        box-shadow: -1em -0.875em 0 hsl(var(--hue2), 90%, 40%) inset;
      }
      to {
        box-shadow: 1.125em 1em 0 hsl(var(--hue2), 90%, 40%) inset;
      }
    }
    @keyframes roll {
      from,
      75% {
        transform: rotateY(-15deg) rotateZ(-30deg) rotateY(0);
      }
      to {
        transform: rotateY(-15deg) rotateZ(-30deg) rotateY(-1turn);
      }
    }
    @keyframes shadow {
      from,
      50%,
      to {
        animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0);
        background-color: hsla(var(--hue), 90%, 10%, 0.3);
        transform: scale(0.6);
      }
      25%,
      75% {
        animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1);
        background-color: hsla(var(--hue), 90%, 10%, 0.5);
        transform: scale(1);
      }
    }

    .loading-text-animation {
      display: inline-block;
      font-size: 2rem;
      font-weight: bold;
      overflow: visible;
      white-space: nowrap;
      animation: pulse 2s ease-in-out infinite both;
    }
    .loading-text-animation span {
      display: inline-block;
    }

    @keyframes wave {
      0% {
        transform: translate(0px);
      }
      20% {
        transform: translate(0px);
      }
      40% {
        transform: translateY(0px);
      }
      60% {
        transform: translateY(-4px);
      }
      80%,
      100% {
        transform: translateY(0);
      }
    }

    @keyframes fadeInTranslate {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .in-animation-03 {
      opacity: 0;
      animation: fadeInTranslate 0.2s ease-out both;
      animation-delay: 0.1s;
    }

    .in-animation {
      opacity: 0;
      animation: fadeInTranslate 0.4s ease-out both;
    }

    .fade-out {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-out;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }
  </style>
  <body
    style="
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
    "
  >
    <div id="root">
      <div
        style="display: flex; align-items: center; justify-content: center"
        class="in-animation-03"
      >
        <h2 class="loading-text-animation">Loading monefy Resources...</h2>
      </div>
    </div>
    <div
      id="global-loader"
      style="
        width: 100%;
        display: flex;
        align-items: center;
        flex-direction: column;
        justify-content: center;
        gap: 32px;
      "
    >
      <div
        class="in-animation"
        style="
          padding: 20px;
          background-color: rgb(220, 252, 237);
          border-radius: 20px;
        "
      >
        <div class="pl" id="coin__animation">
          <div class="pl__coin">
            <div class="pl__coin-flare"></div>
            <div class="pl__coin-flare"></div>
            <div class="pl__coin-flare"></div>
            <div class="pl__coin-flare"></div>
            <div class="pl__coin-layers">
              <div class="pl__coin-layer">
                <div class="pl__coin-inscription"></div>
              </div>
              <div class="pl__coin-layer"></div>
              <div class="pl__coin-layer"></div>
              <div class="pl__coin-layer"></div>
              <div class="pl__coin-layer">
                <div class="pl__coin-inscription"></div>
              </div>
            </div>
          </div>
          <div class="pl__shadow"></div>
        </div>
      </div>
    </div>
    <script>
      window.MIN_ANIMATION = 1400;
      window.pageLoadTime = Date.now();
    </script>

    <script>
      const WAVE_DURATION = 1.5; // seconds
      const DELAY_STEP = 0.1; // seconds
      const PAUSE_TIME = 1600; // miliseconds

      function animateText(
        selector,
        waveDuration = 1.5,
        delayStep = 0.1,
        delay = 0.2,
      ) {
        const element = document.querySelector(selector);
        if (!element) return;

        const text = element.innerText;
        element.innerHTML = ""; // Clear existing text

        text.split("").forEach((char, index) => {
          const span = document.createElement("span");
          span.textContent = char;

          if (char == " ") span.style.margin = "0 4px";

          // Compute animation delay and duration
          const animationDelay = `${index * delayStep + delay}s`;
          const animationDuration = `${waveDuration}s`;

          // Combine into one animation property
          span.style.animation = `wave ${animationDuration} ease-in-out infinite`;
          span.style.animationDelay = animationDelay;
          function restartAnimation() {
            span.style.animation = "none"; // Pause the animation
            setTimeout(() => {
              span.style.animation = `wave ${animationDuration} ease-in-out infinite`;
            }, PAUSE_TIME); // Pause time in ms
          }
          element.appendChild(span);
          span.addEventListener("animationiteration", restartAnimation);
        });
      }

      animateText(".loading-text-animation", WAVE_DURATION, DELAY_STEP);

      function showMetrics() {
        if (!window.PerformanceObserver) return;

        const resourceTypes = ["script", "stylesheet", "img", "svg"];

        let queued = 0;
        let downloaded = 0;

        const trackerDiv = document.createElement("div");
        trackerDiv.id = "RESOURCE-TRACKER";
        trackerDiv.style.position = "fixed";
        trackerDiv.style.bottom = "10px";
        trackerDiv.style.right = "10px";
        trackerDiv.style.background = "rgba(0,0,0,0.7)";
        trackerDiv.style.color = "white";
        trackerDiv.style.padding = "10px";
        trackerDiv.style.borderRadius = "5px";
        trackerDiv.style.fontSize = "14px";
        document.body.appendChild(trackerDiv);

        function updateUI() {
          trackerDiv.innerHTML = `✅ Downloaded resources: ${downloaded}`;
        }

        const observer = new PerformanceObserver((list) => {
          const entries = list.getEntries();

          entries.forEach((entry) => {
            if (resourceTypes.includes(entry.initiatorType)) {
              queued++;
              if (entry.responseEnd) downloaded++;
            }
          });

          updateUI();
        });

        observer.observe({ type: "resource", buffered: true });

        window.addEventListener("load", () => {
          observer.disconnect();
        });
      }
      showMetrics();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
