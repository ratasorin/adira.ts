server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
    location = /api { return 308 /api/; }
    location /api/ {
        # Keep /api in the upstream path. No trailing slash on proxy_pass.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend "${BACKEND_UPSTREAM}";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
    location ~ \.mjs$ { default_type application/javascript; try_files $uri =404; expires 1y; add_header Cache-Control 'public, immutable'; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control 'public, immutable'; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control 'no-cache'; }
}
